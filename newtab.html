<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>New Tab</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="background-overlay"></div>

    <div class="container">
      <div class="time-section">
        <div class="time" id="time"></div>
      </div>

      <div class="greeting" id="greeting"></div>

      <div class="todo-section">
        <!-- Milestone Habit Container -->
        <div id="milestoneContainer" class="milestone-container">
          <!-- Rendered dynamically by JS -->
        </div>

        <div class="todo-input-container">
          <input
            type="text"
            class="todo-input"
            id="todoInput"
            placeholder="What is your main focus for today?..."
            maxlength="100"
          />
        </div>

        <div class="todo-list" id="todoList"></div>

        <div class="todo-stats" id="todoStats">0 tugas · 0 selesai</div>

        <div class="export-actions">
          <button
            disabled
            class="export-btn disabled-btn"
            title="Fitur nyusul nanti"
          >
            ☁️ Save to Cloud
          </button>
          <button
            id="copyMdBtn"
            class="export-btn"
            title="Copy format Obsidian"
          >
            📋 Copy to Obsidian
          </button>
        </div>
      </div>

      <!-- Floating Global Timer/Stopwatch Widget (Pojok Kanan Bawah) -->
      <div id="globalTimerWidget" class="global-timer-widget">
        <div id="timerPanel" class="timer-panel hidden">
          <div class="timer-tabs">
            <button id="tabStopwatch" class="tab-btn active">Stopwatch</button>
            <button id="tabTimer" class="tab-btn">Timer</button>
          </div>

          <div id="displayGlobalTime" class="glass-timer-display">00:00:00</div>

          <div id="timerInputGroup" class="timer-input-group hidden">
            <input
              type="number"
              id="timerMinutes"
              placeholder="Menit"
              min="1"
              max="180"
            />
          </div>

          <div class="timer-controls">
            <button id="startGlobalTimerBtn" class="glass-btn">Start</button>
            <button id="resetGlobalTimerBtn" class="glass-btn icon-only">
              ↺
            </button>
          </div>
        </div>
        <button
          id="toggleTimerPanelBtn"
          class="timer-fab"
          title="Timer & Stopwatch"
        >
          ⏱️
        </button>
      </div>

      <!-- Modal Pop-up Tracking Task (Glassmorphic) -->
      <div id="taskTrackModal" class="modal-overlay hidden">
        <div class="glass-modal-content">
          <span class="track-badge">Task Tracking</span>
          <h4 id="trackTaskTitle" class="track-task-title">---</h4>
          <div id="trackTaskTime" class="glass-timer-display large">
            00:00:00
          </div>

          <div class="modal-actions">
            <button id="pauseTaskTrackBtn" class="glass-btn">Pause</button>
            <!-- Tombol Reset / Restart Baru -->
            <button
              id="restartTaskTrackBtn"
              class="glass-btn icon-only"
              title="Reset waktu ke 00:00:00"
            >
              ↺ Reset
            </button>
            <button id="stopTaskTrackBtn" class="glass-btn danger">
              Stop (Simpan Waktu)
            </button>
            <button id="completeTaskTrackBtn" class="glass-btn success">
              Stop & Selesai ✓
            </button>
          </div>
        </div>
      </div>

      <!-- Modal Schedule Google Calendar -->
      <div id="gcalModal" class="modal-overlay hidden">
        <div class="glass-modal-content">
          <span class="track-badge">📅 Schedule to Google Calendar</span>
          <h4 id="gcalTaskTitle" class="track-task-title">---</h4>
          <div class="gcal-form-group">
            <label for="gcalDate">Tanggal & Waktu Mula:</label>
            <input type="datetime-local" id="gcalDate" class="gcal-input" />
          </div>
          <div class="gcal-form-group">
            <label for="gcalDuration">Durasi (Menit):</label>
            <input type="number" id="gcalDuration" class="gcal-input" value="30" min="15" step="15" />
          </div>

          <div class="modal-actions">
            <button id="openGcalBtn" class="glass-btn success">🚀 Open in Google Calendar</button>
            <button id="saveTaskScheduleBtn" class="glass-btn">💾 Simpan Tanggal Saja</button>
            <button id="closeGcalBtn" class="glass-btn danger">Batal</button>
          </div>
        </div>
      </div>
    </div>

    <script src="newtab.js"></script>
    <script src="timer.js"></script>
  </body>
</html>
